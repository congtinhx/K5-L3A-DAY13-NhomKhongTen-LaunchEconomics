# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Nhóm NhomKhongTen (1 thành viên: Nguyễn Công Tĩnh). Số tính bằng src/lab13.py, hàm nhiem_vu_d.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: co_mau(0,70; 0,75) = 1.251 yêu cầu mỗi nhóm (z chính xác 1,95996 và 0,84162).
#   b) Theo nhân viên, m = 75: DE = 1 + 74 × 0,02 = 2,48; n = 1.251 × 2,48 = 3.103 mỗi nhóm
#      → 3.103 / 75 = 42 người mỗi nhóm, tổng 84 > 40 nhân viên: KHÔNG đủ người.
#   c) 20 nhân viên mỗi nhóm: n hiệu dụng = 20m / (1 + (m − 1) × 0,02) luôn < c / ICC = 20 / 0,02 = 1.000
#      < 1.251: KHÔNG đạt mức chênh 5 điểm, dù mỗi người xử lý bao nhiêu yêu cầu.
#   d) 6 depot mỗi nhóm: n hiệu dụng tối đa < 6 / 0,02 = 300 (và chỉ 6 cụm < 20): loại.
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm: 20m ≥ 859 × (0,98 + 0,02m)
#      → 2,82m ≥ 841,82 → m ≥ 299 yêu cầu mỗi nhân viên (DE = 6,96; n hiệu dụng = 859).
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (theo nhân viên, 20 + 20):
#   1. Đối chứng chạy cùng thời gian: Có, 20 nhân viên đối chứng làm cùng tuần, cùng depot, cùng loại yêu cầu.
#   2. Chia ngẫu nhiên hay do người chọn: Ngẫu nhiên, bốc thăm bằng code với seed 20261130 ghi trước, phân tầng theo depot.
#   3. Ảnh hưởng gián tiếp và cách giảm: Có rủi ro nhân viên đối chứng xem/chép gợi ý của đồng nghiệp cùng depot;
#      giảm bằng quyền truy cập trợ lý theo tài khoản staff_id, log mọi lượt mở trợ lý theo staff_id, loại khỏi
#      phân tích (và báo cáo) nhân viên đối chứng có lượt mở trợ lý.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: Có, chốt trong file này trước ngày bắt đầu 2026-11-30.
#   5. Ít nhất 20 cụm mỗi nhóm: Có, đúng 20 cụm (nhân viên) mỗi nhóm.
#
# Đánh đổi đã chấp nhận (cách chia chưa đạt cả hai điều kiện):
#   Chia theo nhân viên tách được tác động nhưng với 40 người không thể thấy mức chênh 5 điểm (tối đa 1.000 < 1.251).
#   Nhóm chấp nhận mức chênh phát hiện được là 6 điểm (mde 0,06), mỗi nhân viên xử lý ≥ 299 yêu cầu trong phạm vi.
#   Con số bất lợi: nếu tác động thật chỉ là 5 điểm thì power chỉ còn 0,64 (n hiệu dụng 859), tức 36% khả năng bỏ sót.
#   Giám đốc vận hành phải ký chấp nhận đánh đổi này trước ngày bắt đầu.
#   Thời lượng: phạm vi noi_dia + hang_nang ≈ 82% khối lượng (982/1.200) ≈ 31 yêu cầu/nhân viên/ngày
#   → 299 yêu cầu ≈ 10 ngày làm việc ở bước 0.50, cộng 7 ngày chờ cửa sổ mở lại.
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn:
#   Đợt chạy thử: 4,25% (51/1.200) toàn mẫu; 3,97% (39/982) trong phạm vi noi_dia + hang_nang
#   (noi_dia 3,16%, hang_nang 8,23%). Ngưỡng tuyệt đối 3% sẽ dừng pilot ngay tuần đầu, nên luật an toàn
#   so với nhóm đối chứng (chênh ≥ 2 điểm) kèm trần tuyệt đối 6% cho cả phạm vi; hang_nang (8,23%) theo dõi
#   riêng, so với đối chứng cùng loại.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "Chỉ loại noi_dia và hang_nang (0,22× và 0,69× so với 12.000 đ, simulated; thành công 95,0% và 74,1%), 12 depot, 40 nhân viên CSKH. Loại quoc_te (1,88× simulated, thành công 27,3%, chạy lại không giúp: lần 3 chỉ đúng 2,2%) và doi_tac (0,85× simulated, điều khoản riêng)."
  assignment:
    unit: "staff"
    control_share: 0.5
    randomized: true
  rollout: [0.10, 0.25, 0.50]     # mỗi bước một tuần: 4 → 10 → 20 nhân viên dùng trợ lý; chỉ đo chỉ số chính từ bước 0.50
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06                     # đánh đổi đã chấp nhận: 40 nhân viên không đủ mẫu cho 0,05 (power ở 0,05 chỉ 0,64)
    alpha: 0.05
    power: 0.80
    n_per_arm: 859
    design_effect: 6.96
    clusters_per_arm: 20
    requests_per_cluster_min: 299
  identifiability:
    concurrent_control: "Có: 20 nhân viên đối chứng làm cùng thời gian, cùng depot, cùng phạm vi noi_dia + hang_nang; phân bổ ngẫu nhiên bằng code, seed 20261130, phân tầng theo depot."
    spillover_risk: "Trung bình: đồng nghiệp cùng depot có thể chia sẻ gợi ý. Giảm bằng quyền truy cập theo staff_id, log event agent_suggestion_shown theo staff_id, loại và báo cáo riêng nhân viên đối chứng có lượt mở trợ lý."
    predeclared: "Có: chỉ số chính, mde 0,06, ba luật dừng, ngày quyết định 2027-01-05 chốt trong file này trước ngày bắt đầu 2026-11-30."
  stop_rules:                     # 1 an toàn · 2 chi phí · 3 mức độ sử dụng · 4 xem lại
    - "NẾU tỉ lệ mở lại trong 7 ngày của nhóm dùng trợ lý cao hơn nhóm đối chứng từ 2 điểm trở lên hoặc vượt 6% trên toàn phạm vi, hoặc có từ 1 ca hoàn tiền trùng (cùng mã đơn, 2 bản ghi sổ cái ok) TRONG 3 ngày liên tiếp THÌ Giám đốc vận hành tắt trợ lý trong 30 phút và Kỹ sư trưởng agent nộp báo cáo nguyên nhân trong 48 giờ KHÔNG THÌ cấm chuyển sang bước rollout tiếp theo và cấm mở lại trợ lý."
    - "NẾU chi phí mỗi việc thành công (đã cộng cố định, phút xem lại và làm lại đo thật) vượt 8.000 đ TRONG 2 tuần liên tiếp THÌ PM trợ lý hoàn phí thu hẹp phạm vi về chỉ noi_dia và giới hạn tối đa 2 lần chạy trong 2 ngày làm việc KHÔNG THÌ cấm giữ hang_nang trong pilot và cấm tăng tỉ lệ rollout."
    - "NẾU tỉ lệ bỏ qua gợi ý (sua + bo trên số được xem lại; đợt chạy thử 27,12%) vượt 40% TRONG 1 tuần THÌ Trưởng nhóm CSKH phỏng vấn 5 nhân viên và gửi PM 3 nguyên nhân chính trong 3 ngày làm việc KHÔNG THÌ cấm chuyển sang bước rollout tiếp theo."
    - "NẾU tỉ lệ yêu cầu phải xem lại còn trên 50% hoặc thời gian xem lại trung bình (đo thật) trên 5 phút TRONG tuần cuối của bước 0.25 THÌ Trưởng nhóm CSKH áp kế hoạch giảm xem lại theo bậc khi tỉ lệ sua + bo dưới 15% KHÔNG THÌ cấm lên bước 0.50, vì xem lại 100% làm chi phí 0,98–1,03× nhân viên tự làm (simulated)."
  interim_looks: "chỉ kiểm tra chỉ số an toàn (mỗi ngày) và chi phí (mỗi tuần); không xem chỉ số chính trước ngày quyết định để tránh dừng sớm do may rủi"
  rollback: "Giám đốc vận hành (vắng thì Kỹ sư trưởng agent) bấm cờ tắt tính năng, hiệu lực trong 30 phút; mọi yêu cầu mới và đang mở chuyển về luồng nhân viên tự làm (6 phút/yêu cầu), yêu cầu đang chờ ghi sổ cái được đối soát tay trong 24 giờ."
  decision_date: "2027-01-05"
  simulated_inputs:
    - "phut_xem_lai_simulated: 890 phút, 1.780.000 đ (40,7% tổng chi phí)"
    - "phut_lam_lai_simulated: 1.132 phút, 2.264.000 đ (51,8% tổng chi phí); trung bình 15,3 phút mỗi ca lam_lai"
    - "Chi phí mỗi việc thành công 4.472 đ toàn mẫu; 3.414 đ trong phạm vi; 4.599 đ khi cộng cố định (0,38×)"
    - "Chi phí theo loại: noi_dia 2.696 đ, hang_nang 8.221 đ, quoc_te 22.515 đ, doi_tac 10.215 đ"
    - "Bảng độ nhạy B1, B2: làm lại ±51,8%, xem lại ±40,7%, lương +23,1%"
    - "B3: chi phí cả hệ thống 6.901.220 đ ở giới hạn 2 lần (rẻ nhất)"
    - "B4: xem lại 100% 11.743 đ (0,98×) hoặc 12.415 đ (1,03×); hoà vốn khi xem lại tối đa 5,1 hoặc 4,8 phút"
    - "Ngưỡng chi phí 8.000 đ trong luật dừng dựa trên các số simulated ở trên"
